name: fish-features
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fish_local}
      POSTGRES_DB: ${POSTGRES_DB:-fish_features}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
